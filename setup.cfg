[metadata]
name = quenais
version = 0.2.0
description = Quantum Embedding for Strongly Correlated Molecules
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Awadhoot Loharkar

[options]
packages = find:
include_package_data = True
zip_safe = False
python_requires = >=3.10
# pyscf is a hard requirement, not an extra: every stage from the classical
# reference through the embedding Hamiltonian uses it. The 0.1 package
# omitted it, so a clean `pip install quenais` failed on the first command.
install_requires =
    numpy>=1.24
    scipy>=1.10
    matplotlib>=3.7
    pyscf>=2.3

[options.packages.find]
exclude =
    tests
    tests.*
    tools
    notebooks

[options.package_data]
quenais =
    quantum/_gqe_shims/*.py
    patches/*.patch

[options.extras_require]
# ── The two solver stacks are deliberately separate ──────────────────────
# Installing one must never drag in the other. openfermion appears in both
# because it is genuinely shared and is pure Python, which is cheaper than
# introducing a third extra.
qiskit =
    qiskit>=1.0
    qiskit-aer>=0.14
    qiskit-addon-sqd>=0.5
    ffsim>=0.0.50
    openfermion>=1.6

cudaq =
    cudaq
    openfermion>=1.6
    tequila-basic
    torch
    hydra-core>=1.3

# Deprecated alias for the Qiskit stack, kept so existing install scripts
# saying quenais[quantum] keep working. Prefer quenais[qiskit].
quantum =
    quenais[qiskit]

all =
    quenais[qiskit]
    quenais[cudaq]

dev =
    pytest>=7.4
    black>=23.0
    ruff>=0.1

[options.entry_points]
console_scripts =
    quenais-run = quenais.cli:run_pipeline
    quenais-selftest = quenais.selftest:main
    quenais-gqe-setup = quenais.quantum.gqe_setup:main

[tool:pytest]
testpaths = tests
markers =
    slow: end-to-end runs; deselect with -m 'not slow'
    needs_pyscf: requires PySCF
    needs_qiskit: requires the [qiskit] extra
    needs_cudaq: requires the [cudaq] extra and a patched submodule
