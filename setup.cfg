[metadata]
name = quenais
version = 0.3.0
description = Quantum Embedding for Strongly Correlated Molecules
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Awadhoot Loharkar

[options]
packages = find:
include_package_data = True
zip_safe = False
python_requires = >=3.10
# pyscf is a hard requirement, not an extra: every stage from the classical
# reference through the embedding Hamiltonian uses it. The 0.1 package
# omitted it, so a clean `pip install quenais` failed on the first command.
#
# setuptools<82 is a hard requirement too. 82.0.0 (Feb 2026) removed
# pkg_resources, which tequila and several transitive deps still import at
# module load time. Without the ceiling a fresh env installs a setuptools
# that breaks the GQE stack with ModuleNotFoundError: No module named
# 'pkg_resources' at the first import.
install_requires =
    setuptools<82
    numpy>=1.24
    scipy>=1.10
    matplotlib>=3.7
    pyscf>=2.3

[options.packages.find]
exclude =
    tests
    tests.*
    tools
    notebooks

# NOTE: patches/ moved from the repo root into quenais/patches/ in 0.3.
# The old layout listed `patches/*.patch` here while the directory lived at
# the repo root, so package_data never matched and a non-editable install
# shipped no patch at all -- quenais-gqe-setup then failed with
# "Patch not found" on any install that was not `pip install -e .`.
[options.package_data]
quenais =
    quantum/_gqe_shims/*.py
    patches/*.patch

[options.extras_require]
# ── The two solver stacks are deliberately separate ──────────────────────
# Installing one must never drag in the other. openfermion appears in both
# because it is genuinely shared and is pure Python, which is cheaper than
# introducing a third extra.
qiskit =
    qiskit>=1.0,<3
    qiskit-aer>=0.14
    qiskit-addon-sqd>=0.5
    ffsim>=0.0.50
    openfermion>=1.6

# The full runtime dependency set of gqe-for-qsci, declared HERE rather
# than resolved from that repo's own pyproject.toml. Reason: upstream pins
# qiskit==2.0.0, which would downgrade the 2.4.x the Qiskit stack needs for
# qiskit-fermions / qiskit-ibm-runtime. Upstream never imports qiskit --
# the pin is dead -- so install.sh does `pip install --no-deps ./gqe-for-qsci`
# and relies on this list instead.
#
# Not listed here, because pip cannot install it: theochem/pyci. It is a
# source-only build carried as a git submodule (external/pyci) and compiled
# by install.sh. The `pyci` and `qc-PyCI` packages on PyPI are unrelated
# projects -- do NOT add either.
cudaq =
    cudaq
    openfermion>=1.6
    tequila-basic
    torch
    pytorch-lightning>=2.0
    hydra-core>=1.3
    omegaconf>=2.3
    wandb>=0.16
    mpi4py>=3.1

# Deprecated alias for the Qiskit stack, kept so existing install scripts
# saying quenais[quantum] keep working. Prefer quenais[qiskit].
quantum =
    quenais[qiskit]

all =
    quenais[qiskit]
    quenais[cudaq]

dev =
    pytest>=7.4
    black>=23.0
    ruff>=0.1

[options.entry_points]
console_scripts =
    quenais-run = quenais.cli:run_pipeline
    quenais-selftest = quenais.selftest:main
    quenais-doctor = quenais.env_check:main
    quenais-gqe-setup = quenais.quantum.gqe_setup:main

[tool:pytest]
testpaths = tests
markers =
    slow: end-to-end runs; deselect with -m 'not slow'
    needs_pyscf: requires PySCF
    needs_qiskit: requires the [qiskit] extra
    needs_cudaq: requires the [cudaq] extra and a patched submodule